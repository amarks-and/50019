<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Status</title>
  <link rel="stylesheet" type="text/css" href="/iviewbox/atlas-iview.css"></link>
  <style>
    body{margin:0}
    .message{margin:12px;color:#8b0000;white-space:pre-wrap}
    .status-section{margin-top:10px}
  </style>
</head>
<body>
  <main id="content" aria-live="polite">
    <section class="status-section" aria-labelledby="channels-title">
      <div class="titlebardiv" id="channels-title">Test System Channels <span id="ARS1">System not running</span></div>
      <table class="layout styled" id="channels-table">
        <thead><tr class="THheadLink"><td>Name</td><td>Value</td></tr></thead>
        <tbody><tr><td colspan="2">Loading…</td></tr></tbody>
      </table>
    </section>
    <section class="status-section" aria-labelledby="status-title">
      <div class="titlebardiv" id="status-title">Test System Status</div>
      <table class="layout styled" id="status-table">
        <thead><tr class="THheadLink"><td>Name</td><td>Value</td></tr></thead>
        <tbody><tr><td colspan="2">Loading…</td></tr></tbody>
      </table>
    </section>
    <p class="message" id="error-message" hidden></p>
  </main>
  <script>
    function childText(node, name) {
      const child = Array.from(node.children).find(element => element.localName === name);
      return child ? child.textContent.trim() : '';
    }

    function findReport(xml, name) {
      return xml.documentElement.localName === name
        ? xml.documentElement
        : Array.from(xml.getElementsByTagName('*')).find(node => node.localName === name) || null;
    }

    function renderItems(tableId, items) {
      const body = document.querySelector(`#${tableId} tbody`);
      body.replaceChildren();
      items.forEach((item, index) => {
        const row = body.insertRow();
        row.className = index % 2 === 0 ? 'TDSecond' : 'TDFirst';
        row.insertCell().textContent = childText(item, 'Name');
        row.insertCell().textContent = childText(item, 'Value');
      });
      if (!items.length) {
        const row = body.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 2;
        cell.textContent = 'No data available.';
      }
    }

    function renderStatus(xml) {
      if (xml.querySelector('parsererror')) throw new Error('The server returned invalid XML.');
      const channelReport = findReport(xml, 'StatusChansList');
      const statusReport = findReport(xml, 'Status');
      if (!channelReport && !statusReport) throw new Error('The response did not contain AtlasReport/StatusChansList or AtlasReport/Status.');

      const channelItems = channelReport ? Array.from(channelReport.children).filter(item => item.localName === 'Item') : [];
      const statusItems = statusReport ? Array.from(statusReport.children).filter(item => item.localName === 'Item') : [];

      if (channelReport) renderItems('channels-table', channelItems);
      if (statusReport) renderItems('status-table', statusItems);

      const runState = statusReport && Array.from(statusReport.children).find(node => node.localName === 'AtlasRunState');
      const runStateLabel = document.getElementById('ARS1');
      if (runState) {
        const text = runState.textContent.trim();
        runStateLabel.textContent = text;
        runStateLabel.style.color = text.toLowerCase().includes('not running') ? '#ff2222' : '#fff';
      }
      document.getElementById('error-message').hidden = true;
    }

    async function loadStatus() {
      try {
        const response = await fetch('/Status', {
          headers: { Accept: 'application/xml, text/xml' },
          credentials: 'same-origin'
        });
        if (!response.ok) throw new Error(`Request failed (${response.status} ${response.statusText}).`);
        const xml = new DOMParser().parseFromString(await response.text(), 'application/xml');
        renderStatus(xml);
      } catch (error) {
        const output = document.getElementById('error-message');
        output.textContent = `Unable to load system status: ${error.message}`;
        output.hidden = false;
      }
    }

    loadStatus();
    window.setInterval(loadStatus, 10000);
  </script>
</body>
</html>
